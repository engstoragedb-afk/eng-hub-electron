appId: com.enghub.nextron
productName: ENG Hub Panel
copyright: Copyright © 2026 Yoshihide Shiono
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
win:
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
publish:
  provider: github
  owner: engstoragedb-afk
  repo: eng-hub-electron
  releaseType: release
